name: Dependabot Security Review
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  security-scan:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # node-version-file, not a literal: this was the last hardcoded Node
      # version in the workflows and it had already drifted a full minor behind
      # .nvmrc before anyone noticed, because this workflow had never run.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run security audit
        run: npm run security:audit
      - name: Run security tests
        run: npm run test:security
      - name: Add approval comment
        if: success()
        uses: actions/github-script@v9
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const prNumber = context.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: '✅ Security checks passed! This PR can be safely merged after code review.'
            }); 