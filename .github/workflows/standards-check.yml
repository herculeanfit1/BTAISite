# Canonical CI workflow — copy to .github/workflows/standards-check.yml in each agent repo.
# Auto-detects Node/Python/infra and runs the appropriate checks.
# Manifests are found in subdirectories as well as at the root, and PowerShell
# sources are linted wherever they appear, independently of the detected type.
# Maintained by HerculeanOlympus. Do not edit per-repo copies; update the canonical copy here.

name: Standards Check

on:
  pull_request:
  push:
    branches: [main]

# Explicit and minimal, so this gate never inherits an org- or repo-level default
# (Infra PLAN-015 V9). This matters because the fleet is moving from personal
# repos to the BridgingTrustAI org, and the two defaults DISAGREE: several
# personal repos default to `write` while the org defaults to `read`. A workflow
# with no block here would therefore have its GITHUB_TOKEN silently re-scoped by
# a repo transfer — no commit, no diff, no annotation. Pinning it means the grant
# is a property of this file rather than of whoever happens to own the repo.
#
# `contents: read` is the entire requirement. The only GITHUB_TOKEN consumer in
# this workflow is actions/checkout; setup-node and setup-python do not use it,
# and nothing here uploads SARIF, writes an issue, comments on a PR, or requests
# an OIDC token. Widen this ONLY alongside a step that demonstrably needs it.
permissions:
  contents: read       # checkout

# Cancel superseded runs on PR/feature refs; never cancel a run on main
# (keeps the compliance gate complete for every commit that lands on main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  standards:
    name: Standards Compliance
    # Reads the repository variable CI_RUNNER_LINUX, falling back to
    # ubuntu-latest when unset — so repos with a Tower self-hosted runner use
    # it and every other repo is unaffected. Deliberately a variable rather
    # than a hardcoded label: a job requesting a label no runner carries
    # QUEUES FOREVER rather than failing, with nothing showing red. The
    # fallback makes that state unreachable, and rollback is deleting one repo
    # variable rather than a fleet-wide PR sweep during an incident.
    runs-on: ${{ vars.CI_RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # ── Detect repo type ───────────────────────────────
      # Root manifests take precedence — they define the repo's primary language.
      # When there is none, search a few levels down before giving up: several
      # repos keep their manifests in subdirectories (api/ + web/, a2a/) rather
      # than at the root, and treating those as "infra" meant their code was
      # never linted at all.
      #
      # PowerShell is detected independently of `type`, not as another branch of
      # the same if/elif chain. A repo can be Node or infra and still ship .ps1,
      # and PowerShell-only repos still want the infra YAML/JSON validation. So
      # `powershell` is an orthogonal flag, and `type` keeps its old meaning.
      - name: Detect repo type
        id: detect
        run: |
          # Detect against TRACKED files, not the filesystem. `find` picks up
          # whatever happens to be on disk — virtualenvs ship their own
          # Activate.ps1, and repos use .venv/, venv/, venv_new/ interchangeably,
          # so any name-based exclusion list is fragile. git ls-files is exact:
          # it sees what the repo actually contains.
          TRACKED=$(git ls-files)

          # Vendored subtrees are tracked but not ours to lint. A repo declares
          # them in .standardsignore (one path prefix per line, # for comments).
          # Without this, a repo that vendors upstream source would suddenly have
          # that upstream code installed and linted by this gate.
          SKIP_LIST=""
          if [ -f ".standardsignore" ]; then
            SKIP_LIST=$(grep -vE '^[[:space:]]*(#|$)' .standardsignore \
              | tr -d '\r' | sed 's#/*$##' | tr '\n' ' ')
            [ -n "$SKIP_LIST" ] && echo "Honouring .standardsignore: $SKIP_LIST"
          fi

          # Prefix match via awk index() rather than a built regex — the declared
          # paths are literal strings, and escaping them into a regex is a portability
          # trap (the obvious character class is valid in GNU sed and not in BSD sed).
          not_skipped() {
            awk -v skips="$SKIP_LIST" '
              BEGIN { n = split(skips, a, " ") }
              {
                if ($0 ~ /(^|\/)(node_modules|vendor|dist|build)\//) next
                for (i = 1; i <= n; i++)
                  if (a[i] != "" && index($0, a[i] "/") == 1) next
                print
              }'
          }

          # Manifests at most two directories deep. Deeper than that is almost
          # always a fixture or an example, not the project itself.
          manifests() {
            echo "$TRACKED" | grep -E "(^|/)$1\$" | awk -F/ 'NF<=3' | not_skipped | sort
          }

          NODE_MANIFESTS=$(manifests 'package\.json')
          PY_MANIFESTS=$(manifests 'pyproject\.toml')
          PS_FILES=$(echo "$TRACKED" | grep -E '\.(ps1|psm1)$' | not_skipped)

          # Report anything dropped by the depth cap, so a skipped manifest is
          # visible in the log rather than silently uncovered.
          DEEP=$(echo "$TRACKED" | grep -E '(^|/)(package\.json|pyproject\.toml)$' | awk -F/ 'NF>3' | not_skipped)
          [ -n "$DEEP" ] && echo "$DEEP" | sed 's/^/::warning::manifest deeper than 2 directories, not checked: /'

          if [ -n "$NODE_MANIFESTS" ]; then
            TYPE=node
          elif [ -n "$PY_MANIFESTS" ]; then
            TYPE=python
          else
            TYPE=infra
          fi

          # Directory lists, space-separated, for the per-manifest loops below.
          # A root manifest has no "/" in its path, so dirname gives ".".
          dirs_of() {
            while IFS= read -r m; do
              [ -z "$m" ] && continue
              dirname "$m"
            done | tr '\n' ' '
          }
          NODE_DIRS=$(echo "$NODE_MANIFESTS" | dirs_of)
          PY_DIRS=$(echo "$PY_MANIFESTS" | dirs_of)

          # The primary manifest is the one "Node — package.json compliance"
          # treats as LEVEL=error; every other manifest is a warning, because
          # demanding engines.node on every sub-package is stricter than the
          # standard intends.
          #
          # This was `head -1`, and NODE_MANIFESTS arrives SORTED from
          # git ls-files. So any directory sorting before the literal string
          # "package.json" became "primary" and took the error level instead of
          # the repo root: apps/, api/, client/ and frontend/ all do. Measured
          # 2026-08-23 — three repos failing on a sub-package while their root
          # was compliant: LaunchBrief (root >=20, errored on
          # apps/api/package.json), AIStudyPlans (root >=20.19.1, errored on
          # api/package.json), Agora (root >=20.0.0, errored on
          # client/package.json).
          #
          # Root wins when present. Otherwise the SHALLOWEST manifest wins, tie
          # broken alphabetically so the choice is deterministic rather than
          # filesystem-order dependent. A repo with no root manifest still gets
          # a real primary and still fails when that one is non-compliant —
          # synod (frontend/package.json only, no engines) must keep failing.
          # ---8<--- pick_primary (extracted by config/standards.test.js)
          pick_primary() {
            if printf '%s\n' "$1" | grep -qx 'package.json'; then
              printf 'package.json\n'
              return
            fi
            printf '%s\n' "$1" | awk 'NF' \
              | awk -F/ '{ print NF "\t" $0 }' \
              | sort -k1,1n -k2,2 \
              | head -1 | cut -f2-
          }
          # --->8---
          PRIMARY_NODE_MANIFEST=$(pick_primary "$NODE_MANIFESTS")

          {
            echo "type=$TYPE"
            echo "node_dirs=$NODE_DIRS"
            echo "py_dirs=$PY_DIRS"
            echo "primary_node_manifest=$PRIMARY_NODE_MANIFEST"
            if [ -n "$PS_FILES" ]; then echo "powershell=true"; else echo "powershell=false"; fi
          } >> "$GITHUB_OUTPUT"

          echo "Detected repo type: $TYPE"
          [ -n "$NODE_DIRS" ] && echo "  node manifests in: $NODE_DIRS"
          [ -n "$PY_DIRS" ] && echo "  python manifests in: $PY_DIRS"
          [ -n "$PS_FILES" ] && echo "  PowerShell sources present — PSScriptAnalyzer will run"
          exit 0

      # ── Universal checks (all tiers) ──────────────────
      - name: Required files exist
        run: |
          FAILED=0
          for file in STANDARDS.md CLAUDE.md .gitignore; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              FAILED=1
            fi
          done
          exit $FAILED

      - name: No .env files in git
        run: |
          ENV_FILES=$(git ls-files | grep -E '(^|/)\.env(\.local|\.bak|\.backup)?$' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::CRITICAL: .env files committed to git: $ENV_FILES"
            exit 1
          fi

      - name: No hardcoded secrets in docker-compose
        run: |
          COMPOSE_FILES=$(find . \( -name 'docker-compose*.yml' -o -name 'docker-compose*.yaml' \) \
            -not -name '*test*' -not -name '*local*' -not -name '*dev*' -not -name '*ci*' -not -name '*staging*' \
            -not -path '*/dev/*' -not -path '*/test/*' -not -path '*/ci/*' 2>/dev/null || true)
          if [ -n "$COMPOSE_FILES" ]; then
            VIOLATIONS=$(grep -nE '(PASSWORD|SECRET_KEY)=' $COMPOSE_FILES | grep -vE '(\$\{|op://|changeme|REPLACE_ME|change_in_production)' || true)
            if [ -n "$VIOLATIONS" ]; then
              echo "::error::Hardcoded secrets in docker-compose: $VIOLATIONS"
              exit 1
            fi
          fi

      - name: Pre-commit config exists
        run: |
          if [ ! -f ".pre-commit-config.yaml" ]; then
            echo "::error::Missing .pre-commit-config.yaml"
            exit 1
          fi

      - name: Gitignore completeness
        run: |
          REQUIRED=("node_modules/" ".env" ".env.local" ".env.bak" ".env.backup" ".envrc" ".mcp.json" ".DS_Store")
          MISSING=()
          for entry in "${REQUIRED[@]}"; do
            if ! grep -qF "$entry" .gitignore 2>/dev/null; then
              MISSING+=("$entry")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::warning::Missing .gitignore entries: ${MISSING[*]}"
          fi

      - name: 1Password template exists
        run: |
          if [ ! -f ".env.1p.template" ]; then
            echo "::warning::Missing .env.1p.template"
          else
            OP_REFS=$(grep -c 'op://' .env.1p.template || true)
            if [ "$OP_REFS" -eq 0 ]; then
              echo "::warning::.env.1p.template has no op:// references"
            fi
          fi

      - name: CLAUDE.md has required sections
        run: |
          for section in "Identity" "Scope" "Commands" "Standards"; do
            if ! grep -qi "##.*${section}\|#.*${section}" CLAUDE.md 2>/dev/null; then
              echo "::warning::CLAUDE.md missing section: $section"
            fi
          done

      # ── Node.js checks ────────────────────────────────
      # Every Node step loops over the detected manifest directories, so a repo
      # that keeps package.json under api/ and web/ gets BOTH linted instead of
      # neither. For a conventional root-manifest repo the loop runs once over ".".
      # A linter config is accepted from the manifest's own directory or from the
      # repo root, since monorepo-ish layouts commonly share one config.
      - name: Node — linter config exists
        if: steps.detect.outputs.type == 'node'
        run: |
          FAILED=0
          for d in ${{ steps.detect.outputs.node_dirs }}; do
            if [ -f "$d/biome.json" ] || [ -f "biome.json" ] \
               || [ -f "$d/eslint.config.js" ] || [ -f "$d/eslint.config.mjs" ] \
               || [ -f "$d/.eslintrc.json" ] || [ -f "$d/.eslintrc.js" ] \
               || [ -f "eslint.config.js" ] || [ -f "eslint.config.mjs" ] \
               || [ -f ".eslintrc.json" ] || [ -f ".eslintrc.js" ]; then
              continue
            fi
            echo "::error::$d: missing linter config (expected biome.json or eslint config)"
            FAILED=1
          done
          exit $FAILED

      # `type` and `engines.node` are gated on the PRIMARY manifest only. A repo
      # with a nested client/ or api/ package declares its runtime once; demanding
      # engines.node on every sub-package is stricter than the standard intends
      # and would fail repos that are compliant as written. Sub-manifests still
      # get reported, as warnings, so the gap is visible without being fatal.
      - name: Node — package.json compliance
        if: steps.detect.outputs.type == 'node'
        run: |
          FAILED=0
          PRIMARY="${{ steps.detect.outputs.primary_node_manifest }}"

          # ─────────────────────────────────────────────────────────────────
          # THESE SNIPPETS RUN BEFORE `Node — setup`, ON WHATEVER NODE THE
          # RUNNER HAPPENS TO HAVE. Keep them pre-ES2020: no optional chaining
          # (`?.`), no nullish coalescing (`??`), no modern builtins.
          #
          # Hosted runners ship a modern node, so a violation here is invisible
          # until a self-hosted runner adopts this workflow. Tower's runner image
          # carries system node v10.19.0 at /usr/bin/node, where `?.` is a
          # SyntaxError — measured 2026-08-27, HerculeanInfra run 33126329305.
          #
          # THE ORDERING IS LOAD-BEARING. `Node — setup` resolves its version
          # from `node-version-file: <primary manifest>` — the very field this
          # step checks. Running setup first would make a repo that is MISSING
          # engines.node fail at setup with an opaque action error, and this step
          # would never run to say why. Do not "simplify" by moving setup above
          # this.
          #
          # Interpreter failures are reported SEPARATELY from a missing field.
          # GitHub's default shell is `bash -e {0}`, so a failing `node -e` in a
          # bare assignment kills the step outright — loud, but illegible: a bare
          # exit code 1 and a stack trace whose only tell is that `vm.js` is a
          # Node 10-era path. Nothing said "your runner's node is ancient".
          # ─────────────────────────────────────────────────────────────────
          read_pkg_field() {
            # $1 = absolute manifest path, $2 = JS expression over `pkg`
            node -e "var pkg = require('$1'); console.log(($2) || '')"
          }
          node_fault() {
            echo "::error::$1: node could not evaluate this manifest (node $(node --version 2>&1 | head -1)). This is a RUNNER TOOLCHAIN fault, not a compliance failure — do not edit the manifest in response. This step runs before \`Node — setup\`, so it uses the runner's system node."
          }

          for d in ${{ steps.detect.outputs.node_dirs }}; do
            MANIFEST="$d/package.json"
            [ "$d" = "." ] && MANIFEST="package.json"
            if [ "$MANIFEST" = "$PRIMARY" ]; then LEVEL=error; else LEVEL=warning; fi

            if ! TYPE=$(read_pkg_field "$PWD/$MANIFEST" "pkg.type"); then
              node_fault "$MANIFEST"; FAILED=1; continue
            fi
            if [ "$TYPE" != "module" ]; then
              echo "::${LEVEL}::$MANIFEST missing \"type\": \"module\""
              [ "$LEVEL" = "error" ] && FAILED=1
            fi

            if ! ENGINES=$(read_pkg_field "$PWD/$MANIFEST" "pkg.engines && pkg.engines.node"); then
              node_fault "$MANIFEST"; FAILED=1; continue
            fi
            if [ -z "$ENGINES" ]; then
              echo "::${LEVEL}::$MANIFEST missing engines.node"
              [ "$LEVEL" = "error" ] && FAILED=1
            fi
          done
          exit $FAILED

      - name: Node — op run wrapping
        if: steps.detect.outputs.type == 'node'
        run: |
          for d in ${{ steps.detect.outputs.node_dirs }}; do
            MANIFEST="$PWD/$d/package.json" node -e "
              const pkg = require(process.env.MANIFEST);
              const scripts = pkg.scripts || {};
              const needsSecrets = Object.entries(scripts)
                .filter(([k, v]) => v.includes('node ') && !k.match(/^(lint|format|check|biome|test|pre-commit)/))
                .filter(([k, v]) => !v.includes('op run'))
                .filter(([k]) => !scripts['op:' + k]);
              if (needsSecrets.length > 0) {
                console.log('::warning::' + process.env.MANIFEST + ': scripts without op run wrapping: ' + needsSecrets.map(([k]) => k).join(', '));
              }
            " 2>/dev/null || echo "::warning::$d/package.json: node could not evaluate this manifest (node $(node --version 2>&1 | head -1)) — op-run wrapping check SKIPPED. Runner toolchain fault, not a repo problem."
          done

      - name: Node — package-lock committed
        if: steps.detect.outputs.type == 'node'
        run: |
          for d in ${{ steps.detect.outputs.node_dirs }}; do
            LOCK="$d/package-lock.json"
            [ "$d" = "." ] && LOCK="package-lock.json"
            # `|| echo "0"` here used to convert ANY node failure into "this
            # package has zero dependencies", silently skipping the lockfile
            # check. Latent rather than firing — this snippet has no modern
            # syntax, so it survives on Node 10 — but the failure mode was
            # indistinguishable from a clean result. A skipped check now says so.
            if ! DEPS=$(node -e "var pkg = require('$PWD/$d/package.json'); console.log(Object.keys(pkg.dependencies || {}).length)" 2>/dev/null); then
              echo "::warning::$d/package.json: node could not evaluate this manifest (node $(node --version 2>&1 | head -1)) — lockfile check SKIPPED. Runner toolchain fault, not a repo problem."
              continue
            fi
            if [ "$DEPS" -gt 0 ]; then
              if ! git ls-files --error-unmatch "$LOCK" >/dev/null 2>&1; then
                echo "::warning::$LOCK not committed"
              fi
            fi
          done

      - name: Node — setup
        if: steps.detect.outputs.type == 'node'
        uses: actions/setup-node@v7
        with:
          node-version-file: ${{ steps.detect.outputs.primary_node_manifest }}

      - name: Node — install dependencies
        if: steps.detect.outputs.type == 'node'
        env:
          npm_config_engine_strict: 'false'
        run: |
          for d in ${{ steps.detect.outputs.node_dirs }}; do
            echo "── installing in $d ──"
            ( cd "$d"
              if [ -f "package-lock.json" ]; then
                npm ci --no-audit --no-fund || npm ci --no-audit --no-fund --force
              elif [ -f "yarn.lock" ]; then
                yarn install --frozen-lockfile
              else
                npm install --no-audit --no-fund || npm install --no-audit --no-fund --force
              fi
            ) || exit 1
          done

      # A DIRECTORY'S OWN LINTER CONFIG WINS OVER A ROOT ONE. The root config is
      # the fallback for directories that have none, not an override for those
      # that do.
      #
      # This used to ask only "does a root config exist?" and, if so, lint the
      # whole tree from the root with that single tool. That assumes one linter
      # governs a repo, and it silently drops coverage when two divide the work.
      #
      # NameBridge, measured 2026-08-24: root biome.json (formatter AND linter
      # enabled, and biome is not a dependency anywhere), while apps/web and
      # apps/api each carry eslint.config.mjs with eslint, typescript-eslint,
      # react-hooks and react-refresh. biome is the FORMATTER, eslint is the
      # LINTER. The gate saw the root biome.json, ran `biome check .`, and NEVER
      # ran eslint — so every typescript-eslint and react-hooks rule vanished.
      # The danger is not a red PR; it is a green one with the coverage gone.
      #
      # Deleting the root biome.json is not the fix: .pre-commit-config.yaml
      # pins @biomejs/biome@2.4.12 as a biome-check hook and would break.
      #
      # The root case is unchanged for repos that genuinely have one linter: a
      # repo whose only config is at the root still gets exactly one run, from
      # the root, because "." is itself a node_dir.
      - name: Node — run linter
        if: steps.detect.outputs.type == 'node'
        run: |
          # ---8<--- linter_for (extracted by config/standards.test.js)
          # Echoes "<tool>:<source>" for a directory — the tool that governs it
          # and whether that came from its own config or the root's.
          linter_for() {
            d="$1"
            [ -f "$d/biome.json" ] && { echo "biome:own"; return; }
            for c in eslint.config.js eslint.config.mjs .eslintrc.json .eslintrc.js; do
              [ -f "$d/$c" ] && { echo "eslint:own"; return; }
            done
            [ -f "biome.json" ] && { echo "biome:root"; return; }
            for c in eslint.config.js eslint.config.mjs .eslintrc.json .eslintrc.js; do
              [ -f "$c" ] && { echo "eslint:root"; return; }
            done
            echo "none:none"
          }
          # --->8---

          run_in() {  # $1 = dir, $2 = tool
            case "$2" in
              biome)  ( cd "$1" && npx @biomejs/biome check . ) ;;
              eslint) ( cd "$1" && npx eslint . ) ;;
            esac
          }

          FAILED=0
          ROOT_TOOL="$(linter_for . | cut -d: -f1)"

          # The root run is kept EXACTLY as it was, once, from the root. The old
          # comment's reasoning still holds: a root config governs the whole tree
          # (Agora's biome.json includes "**", covering client/), and descending
          # into a subdirectory to re-run it would resolve that config's own
          # include/exclude globs against the wrong base. This change does not
          # touch that path.
          if [ "$ROOT_TOOL" != "none" ]; then
            echo "── $ROOT_TOOL from repo root (root config governs the tree) ──"
            run_in . "$ROOT_TOOL" || FAILED=1
          fi

          # Purely ADDITIVE: any directory carrying its OWN config is linted with
          # it as well. That is the coverage the root-only run was dropping. A
          # repo with a single root config reaches this loop and matches nothing,
          # so its behaviour is byte-for-byte what it was.
          for d in ${{ steps.detect.outputs.node_dirs }}; do
            [ "$d" = "." ] && continue
            sel="$(linter_for "$d")"
            tool="${sel%%:*}"; src="${sel#*:}"
            if [ "$src" = "own" ]; then
              echo "── $tool (own config) in $d ──"
              run_in "$d" "$tool" || FAILED=1
            elif [ "$ROOT_TOOL" = "none" ]; then
              echo "::error::$d: no linter config (expected biome.json or an eslint config)"
              FAILED=1
            fi
          done
          exit $FAILED

      # ── Python checks ──────────────────────────────────
      - name: Python — linter config exists
        if: steps.detect.outputs.type == 'python'
        run: |
          for d in ${{ steps.detect.outputs.py_dirs }}; do
            if [ ! -f "$d/pyproject.toml" ]; then
              echo "::error::$d: missing pyproject.toml"
              exit 1
            fi
            if ! grep -q "\[tool.ruff\]" "$d/pyproject.toml" 2>/dev/null; then
              echo "::warning::$d/pyproject.toml missing [tool.ruff] section"
            fi
          done

      - name: Python — setup
        if: steps.detect.outputs.type == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Python — install tools
        if: steps.detect.outputs.type == 'python'
        run: |
          pip install ruff==0.16.4 mypy==1.19.1
          # Install project deps so mypy can resolve imports.
          # Globs cover: requirements.txt, requirements-*.txt (e.g. -dev, -prod),
          # requirements/*.txt, and subdir/requirements.txt.
          for req in requirements.txt requirements-*.txt requirements/*.txt */requirements.txt; do
            for f in $req; do
              [ -f "$f" ] && pip install -r "$f" 2>/dev/null || true
            done
          done

      - name: Python — ruff lint & format
        if: steps.detect.outputs.type == 'python'
        run: |
          # `--extend-exclude '*.md'` keeps this gate on source only.
          #
          # ruff 0.16 formats Python code blocks inside Markdown by default. The
          # ruff-pre-commit hooks do not and never have — all three declare
          # `types_or: [python, pyi, jupyter]`. Without this flag the local hook passes
          # and CI fails on documentation, which is a disagreement between the two, not
          # a stronger gate.
          #
          # EXTEND, not `--exclude`. The bare flag REPLACES the exclude list instead of
          # adding to it, discarding ruff's defaults (.venv, .git, node_modules, dist,
          # build) AND any per-repo `[tool.ruff] exclude`. Measured 2026-08-22:
          # `--exclude '*.md'` turned Citadel365 red with 13 files and SchedulEd with 1,
          # and pulled a planted `.venv/lib/vendored.py` back into scope. Same replace-
          # don't-merge trap as `--per-file-ignores` in the bandit step below.
          FAILED=0
          for d in ${{ steps.detect.outputs.py_dirs }}; do
            echo "── ruff $d ──"
            ( cd "$d" && ruff check --extend-exclude '*.md' . \
                      && ruff format --check --extend-exclude '*.md' . ) || FAILED=1
          done
          exit $FAILED

      - name: Python — ruff security rules (bandit)
        if: steps.detect.outputs.type == 'python'
        run: |
          # Exempt S101 (use of `assert`) in test files — pytest convention.
          # Use --extend-per-file-ignores so per-repo pyproject.toml settings
          # also apply (CLI --per-file-ignores alone would replace, not merge).
          # `--extend-exclude '*.md'` is a no-op here — `ruff check` reports
          # "No Python files found" on Markdown and never reads a fence, so a doc
          # example cannot trip a security rule. Carried anyway so all three ruff
          # invocations state the same scope; one bare invocation is how the next
          # person concludes the rule is applied inconsistently and "fixes" it.
          FAILED=0
          for d in ${{ steps.detect.outputs.py_dirs }}; do
            ( cd "$d" && ruff check --select S \
              --extend-exclude '*.md' \
              --extend-per-file-ignores 'tests/**:S101' \
              --extend-per-file-ignores 'test/**:S101' \
              --extend-per-file-ignores '**/test_*.py:S101' \
              --extend-per-file-ignores '**/*_test.py:S101' \
              --extend-per-file-ignores '**/conftest.py:S101' \
              . ) || FAILED=1
          done
          exit $FAILED

      - name: Python — mypy strict
        if: steps.detect.outputs.type == 'python'
        run: |
          FAILED=0
          for d in ${{ steps.detect.outputs.py_dirs }}; do
            echo "── mypy $d ──"
            ( cd "$d" && mypy --strict . ) || {
              EC=$?
              # Exit code 2 = no files found (e.g. all excluded), treat as OK
              if [ $EC -eq 2 ]; then
                echo "::warning::$d: mypy found no files to check"
              else
                FAILED=1
              fi
            }
          done
          exit $FAILED

      # ── Dockerfile checks ────────────────────────────────
      # Manual install + find loop instead of hadolint-action@v3.1.0:
      # the action's recursive mode passes the literal glob `**/Dockerfile`
      # to hadolint (which doesn't expand it), causing "file does not
      # exist" errors when Dockerfiles live under non-root paths
      # (e.g. `.devcontainer/Dockerfile`). Manual find is reliable.
      - name: Lint Dockerfiles (hadolint)
        if: hashFiles('**/Dockerfile') != ''
        run: |
          curl -sSfL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 \
            -o /tmp/hadolint
          chmod +x /tmp/hadolint
          FAIL_MARKER=$(mktemp)
          rm -f "$FAIL_MARKER"
          find . -name 'Dockerfile' -not -path '*/node_modules/*' -not -path '*/.git/*' -print0 \
            | while IFS= read -r -d '' f; do
            /tmp/hadolint --failure-threshold error "$f" || touch "$FAIL_MARKER"
          done
          [ -f "$FAIL_MARKER" ] && { rm -f "$FAIL_MARKER"; exit 1; }
          exit 0

      # ── PowerShell checks ──────────────────────────────
      # Deliberately keyed off `powershell`, not `type`. PowerShell-heavy repos
      # carry no package.json or pyproject.toml, so they detect as `infra` — and
      # the infra branch only validates YAML/JSON. Before this step their .ps1
      # was never linted by any branch of this workflow, which meant the gate
      # went green without reading the repo's actual code.
      #
      # Honours a repo-local PSScriptAnalyzerSettings.psd1 when present, so a
      # repo can tune its own rule set without editing the canonical.
      - name: PowerShell — PSScriptAnalyzer
        if: steps.detect.outputs.powershell == 'true'
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -Repository PSGallery

          $params = @{ Path = '.'; Recurse = $true }
          $settings = 'PSScriptAnalyzerSettings.psd1'
          if (Test-Path $settings) {
            Write-Host "Using repo settings: $settings"
            $params['Settings'] = (Resolve-Path $settings).Path
          } else {
            Write-Host "::warning::No PSScriptAnalyzerSettings.psd1 — using PSScriptAnalyzer defaults"
          }

          $results = Invoke-ScriptAnalyzer @params |
            Where-Object { $_.ScriptPath -notmatch '[\\/](node_modules|\.git|\.venv|vendor|dist|build)[\\/]' }

          $errors   = @($results | Where-Object Severity -eq 'Error')
          $warnings = @($results | Where-Object Severity -eq 'Warning')

          foreach ($r in $results) {
            $level = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
            Write-Host "::${level} file=$($r.ScriptPath),line=$($r.Line)::$($r.RuleName): $($r.Message)"
          }

          Write-Host "PSScriptAnalyzer: $($errors.Count) error(s), $($warnings.Count) warning(s)"
          # Gate on Error only, matching how hadolint is gated (--failure-threshold error).
          if ($errors.Count -gt 0) { exit 1 }

      # ── Infra checks ───────────────────────────────────
      # The infra lane's YAML validator needs PyYAML, which is NOT part of any
      # runner contract — it happens to be present on ubuntu-latest and is absent
      # from Tower's org runner pool (measured 2026-08-29: Python 3.8.10, no
      # `yaml` module). So it is installed here rather than inherited. See #167.
      - name: Infra — setup Python
        if: steps.detect.outputs.type == 'infra'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Infra — install and ASSERT the YAML toolchain
        if: steps.detect.outputs.type == 'infra'
        run: |
          python3 -m pip install pyyaml==6.0.2
          # ASSERT what must be PRESENT; never infer it from the runner image.
          # A successful `pip install` is not evidence that the `python3` the NEXT
          # step resolves can import the module — different interpreter, different
          # PATH, a user-site install the runner's python cannot see. This line
          # closes that gap by importing with the same `python3` the validator
          # uses, and it fails loudly when it cannot.
          python3 -c 'import sys, yaml; print("PyYAML " + yaml.__version__ + " importable by " + sys.executable)'

      - name: Infra — validate YAML/JSON
        if: steps.detect.outputs.type == 'infra'
        run: |
          # stderr is CAPTURED, not discarded (#167).
          #
          # This block used to end each interpreter call with `2>/dev/null || {
          # echo "::error::Invalid YAML: $f" ... }`, which made two completely
          # different failures produce one identical annotation:
          #
          #   * a genuine syntax error in the file  -> "Invalid YAML: <f>"
          #   * `ModuleNotFoundError: No module named 'yaml'` on a runner without
          #     PyYAML                              -> "Invalid YAML: <f>"
          #
          # The second is not a repo problem at all, and the annotation sent the
          # reader to the wrong place. It never fired historically because only
          # node-type repos had been flipped to self-hosted; HerculeanN8NBuilder
          # (type=infra) was flipped 2026-08-29 and rolled back on this finding
          # before its next push reached the step. The `Infra — setup Python`
          # step above now removes the cause; this keeps the two distinguishable
          # if any other toolchain gap appears.
          #
          # The annotation carries the LAST line of stderr, not the first 300 chars.
          # A GitHub annotation is single-line, and a Python traceback puts the only
          # part that identifies the failure -- `ModuleNotFoundError: No module named
          # 'yaml'` vs `yaml.scanner.ScannerError: ...` -- on its LAST line. Taking a
          # prefix instead spends the whole budget on the traceback header and drops
          # exactly the text the two cases differ by. The full multi-line stderr is
          # still written to the step log; only the annotation is condensed.
          FAIL_MARKER=$(mktemp)
          rm -f "$FAIL_MARKER"
          find . \( -name '*.yml' -o -name '*.yaml' \) -not -path '*/node_modules/*' -not -name '*.override.*' -print0 \
            | head -z -n 20 | while IFS= read -r -d '' f; do
            if ! ERR=$(python3 -c "import yaml; yaml.safe_load(open('$f'))" 2>&1); then
              printf '%s\n' "$ERR" >&2
              echo "::error::Invalid YAML: $f — $(printf '%s' "$ERR" | tail -n 1 | cut -c1-300)"
              touch "$FAIL_MARKER"
            fi
          done
          # Skip JSONC-by-convention files: tsconfig*.json (TypeScript) and
          # anything under .vscode/. These allow comments and trailing commas
          # and will fail a strict json.load — they're not invalid, just JSONC.
          find . -name '*.json' -not -path '*/node_modules/*' -not -path '*/.git/*' \
            -not -path '*/.devcontainer/*' -not -path '*/.vscode/*' \
            -not -name 'tsconfig*.json' -not -name '*.jsonc' \
            -print0 | head -z -n 20 | while IFS= read -r -d '' f; do
            if ! ERR=$(python3 -c "import json; json.load(open('$f'))" 2>&1); then
              printf '%s\n' "$ERR" >&2
              echo "::error::Invalid JSON: $f — $(printf '%s' "$ERR" | tail -n 1 | cut -c1-300)"
              touch "$FAIL_MARKER"
            fi
          done
          [ -f "$FAIL_MARKER" ] && { rm -f "$FAIL_MARKER"; exit 1; }
          exit 0
