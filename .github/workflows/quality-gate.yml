# REPO-OWNED workflow — not a canonical fleet file. Edit it here.
#
# Cloud CI for this repo was deployment-only: cost-optimized-ci.yml deploys,
# standards-check.yml lints, security-scan.yml runs Trivy. Nothing compiled the
# app, type-checked it, or ran a test, so a PR that failed to build could merge
# and the push-to-main deploy fired with no correctness check ahead of it. The
# only real gate was an optional ~15-minute local script.
#
# Lint is deliberately absent here: standards-check.yml already runs
# `npx eslint .`, and a second copy would just double the failure surface.
name: Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# Must key on BOTH github.workflow and github.event_name — sharing a group
# across workflows made Standards Check and SWA Deployment cancel each other
# (PR #14), and omitting event_name cancelled the merge run when push and
# pull_request:closed fired together (PR #18).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Quality Gate / frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run type-check

      # The full suite, with coverage thresholds enforced. `npm run` (not
      # `npx vitest`) is required: the pretest:coverage hook runs
      # scripts/fix-rollup.js, which works around npm/cli#4828 on Linux, and
      # calling vitest directly silently skips it.
      #
      # Do NOT narrow this to a pinned path list. A vitest path filter matching
      # zero files is ignored as long as another filter matches, so a stale
      # entry makes the gate quietly run less than it claims while staying
      # green — the exact failure this workflow exists to prevent.
      - name: Tests + coverage thresholds
        run: npm run test:coverage

      - run: npm run build

  # ===========================================================================
  # E2E — ADVISORY, NOT REQUIRED
  # ===========================================================================
  # Deliberately NOT a required status check yet. A new gate that blocks merges
  # before it has a track record gets switched off the first time it flakes, and
  # then it is off permanently. Promote it to required once it has been green
  # across several PRs — the same staging this repo used for the Quality Gate
  # itself.
  #
  # Runs independently of `frontend` (no `needs:`), so a Playwright flake cannot
  # mask a type or unit-test failure and both report in parallel.
  #
  # Chromium only. Five browser projects is five times the minutes for a
  # marketing site, and the config still defines the other four for local runs.
  e2e:
    name: Quality Gate / e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # --with-deps installs the system libraries the browser needs on a bare
      # runner. The Playwright version comes from package.json, so the browser
      # build is pinned with it rather than floating.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and serves a PRODUCTION bundle when CI is
      # set, rather than the dev server used locally. The two are not
      # equivalent: the CSP grants 'unsafe-eval' only to the dev server, and
      # this repo has already shipped a defect (no security headers at all)
      # that existed solely in the deployed artifact.
      - name: E2E
        run: npx playwright test --project=chromium

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
