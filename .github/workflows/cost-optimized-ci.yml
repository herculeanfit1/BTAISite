name: Azure Static Web Apps Deployment

# =============================================================================
# COST-OPTIMIZED GITHUB ACTIONS WORKFLOW
# =============================================================================
# COST OPTIMIZATION STRATEGY:
# - Main branch pushes: Direct deployment only (local validation required)
# - Pull requests: Direct deployment only (local validation required)
# - Local CI/CD: Run ./ci/g_master.sh before pushing to main
# - GitHub Actions: DEPLOYMENT ONLY - no CI/CD pipeline
# - Oryx handles Next.js build and hybrid rendering setup
# =============================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

# Security: Minimal permissions
permissions:
  contents: read
  id-token: write  # For Azure OIDC
  pull-requests: read

# Limit concurrent runs to save costs
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # =============================================================================
  # DIRECT DEPLOYMENT JOB (main branch pushes only)
  # =============================================================================
  deploy-main-to-azure:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # ~5 min deploy + up to ~4 min post-deploy verification (the API poll).
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: false
          lfs: false

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRIDGINGTRUST_WEBSITE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
        env:
          NODE_VERSION: "22.22.0"

      # Deploying successfully is not the same as working. This step checks the
      # API, not the pages, because the pages were never the thing that broke.
      #
      # As of 2026-07-24, /api/* is served by the Next.js app itself as App Router
      # route handlers (app/api/*/route.ts) -- there is NO linked backend. A deploy
      # can no longer "drop" the routing, because the API ships inside the same
      # artifact as the pages. So if this check fails, the app or its deploy is
      # broken; it is NOT a dropped link, and re-linking a Function App is not the
      # fix (Microsoft documents Function App linking as unsupported for hybrid
      # Next.js). See docs/projects/API-CONSOLIDATION-PLAN-2026-07-24.md.
      - name: Post-deployment verification
        run: |
          set -uo pipefail
          SITE="https://bridgingtrust.ai"
          ORIGIN="https://wonderful-bush-0e888f30f.6.azurestaticapps.net"

          # Verify /api/* after the deploy, accepting EITHER the SWA origin OR the
          # custom domain (apex) as healthy. Post-deploy the apex
          # (bridgingtrust.ai via Cloudflare) lags the origin by several minutes
          # while routing propagates, so polling the apex alone produced a false
          # failure on every deploy. Both hit the same Next.js managed backend
          # (there is no linked backend as of 2026-07-24), so origin-healthy is a
          # sound signal that the deploy worked; the apex catches up shortly and
          # is reported below as a non-blocking check.
          health_url=""
          echo "::group::Waiting for /api/health (origin or apex)"
          for i in $(seq 1 24); do
            for u in "$ORIGIN" "$SITE"; do
              if printf '%s' "$(curl -sS --max-time 15 "$u/api/health" 2>/dev/null || true)" | grep -q '"status"'; then
                health_url="$u"
                break
              fi
            done
            if [ -n "$health_url" ]; then
              echo "attempt $i: healthy via $health_url"
              break
            fi
            echo "attempt $i: not ready yet"
            sleep 20
          done
          echo "::endgroup::"

          if [ -z "$health_url" ]; then
            echo "::error::/api/* is not reachable on the SWA origin or the apex after deploy."
            echo "/api/* is served by the Next.js app itself (no linked backend), so this"
            echo "means the app or its deploy is broken -- check this run's build and deploy"
            echo "logs and the Static Web App's application settings. Do NOT re-link a"
            echo "Function App; that mechanism is retired and unsupported for hybrid Next.js."
            exit 1
          fi

          # Exercise the lead path against whichever host reported healthy. An
          # intentionally invalid payload is rejected by Zod before any email is
          # sent or any CRM record is written, so this proves the handler runs
          # without creating a lead.
          echo "::group::Verifying /api/contact reaches its handler via $health_url"
          probe="$(curl -sS -o /dev/null --max-time 25 -w '%{http_code} %{content_type}' \
              -X POST "$health_url/api/contact" \
              -H 'Content-Type: application/json' \
              -d '{"email":"not-an-email","message":""}' || echo 'curl-failed -')"
          status="${probe%% *}"
          ctype="${probe#* }"
          echo "status=$status content-type=$ctype"
          echo "::endgroup::"

          case "$status:$ctype" in
            400:application/json*)
              echo "Contact endpoint is live and validating." ;;
            *)
              echo "::error::POST /api/contact returned '$status $ctype'; expected a JSON 400."
              echo "An HTML response means the request fell through to the static site"
              echo "instead of reaching the /api/contact route handler."
              exit 1 ;;
          esac

          # Non-blocking: report the apex (what users hit) even if the gate
          # passed via the origin -- the apex usually settles within minutes.
          if printf '%s' "$(curl -sS --max-time 15 "$SITE/api/health" 2>/dev/null || true)" | grep -q '"status"'; then
            echo "apex /api/health healthy."
          else
            echo "::warning::apex /api/health not yet propagated (origin healthy); usually settles within minutes."
          fi

  # =============================================================================
  # PR DEPLOYMENT JOB (deployment only)
  # =============================================================================
  deploy-pr-to-azure:
    # Same-repo PRs only. This repo is public, so a fork PR reaching this job
    # gets an empty AZURE_STATIC_WEB_APPS_API_TOKEN_* (GitHub withholds secrets
    # from fork-triggered `pull_request` runs) and fails with a confusing red X
    # on an otherwise valid contribution. The guard also keeps the job from
    # becoming a real token-exposure path if the trigger is ever changed to
    # `pull_request_target`, which does receive secrets.
    # Dependabot is excluded because this job CANNOT succeed for it, not as a
    # policy choice. Dependabot-triggered runs read from a separate secret store
    # (the log says `Secret source: Dependabot`), which does not contain
    # AZURE_STATIC_WEB_APPS_API_TOKEN_*, so the deploy fails with
    # `deployment_token was not provided` after ~40s. Every Dependabot PR wore a
    # red X for a preview that was never possible. Nothing here is worth
    # previewing on a dependency bump anyway.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: false
          lfs: false

      - name: Deploy PR to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRIDGINGTRUST_WEBSITE }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: ""
        env:
          NODE_VERSION: "22.22.0"
          # Marks this as a preview build so /api/contact skips real side effects.
          PREVIEW_BUILD: "true"

      # -----------------------------------------------------------------------
      # PERFORMANCE BUDGETS -- ADVISORY (PLAN-013 Part 2)
      # -----------------------------------------------------------------------
      # Lives here, not in quality-gate.yml, because this is the only job that
      # knows the preview URL, and the measurement is worthless anywhere else:
      # measured 2026-07-28 on the same commit, desktop preset, 3 runs --
      #   local `npm run start`  perf 100, TBT   0ms
      #   SWA preview origin     perf  97, TBT   0ms
      #   apex bridgingtrust.ai  perf  79, TBT 360ms
      # A localhost gate reports a perfect 100 while real users get 79. It
      # would pass forever and detect nothing.
      #
      # continue-on-error while it earns a track record, same staging as the
      # e2e job. Thresholds live in lighthouserc.json and are all met today.
      - name: Setup Node
        if: steps.deploy.outputs.static_web_app_url != ''
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Lighthouse budgets against the preview
        id: lighthouse
        if: steps.deploy.outputs.static_web_app_url != ''
        continue-on-error: true
        # Version pinned inline rather than via `npm ci`: this job only needs
        # lhci, and installing the full devDependency tree here would pull
        # Playwright and its browsers to run a Lighthouse check.
        # Keep in step with the @lhci/cli pin in package.json.
        # Chrome is auto-detected -- the runner image ships one, and hard-coding
        # a path breaks silently when the image moves it.
        #
        # The chown is required, not defensive. Azure/static-web-apps-deploy runs
        # in a Docker container as root and leaves root-owned files in the
        # workspace, so this step -- running as `runner` -- cannot mkdir
        # .lighthouseci and lhci aborts at its healthcheck with EACCES. On the
        # first run that produced a GREEN job that had measured nothing, because
        # continue-on-error swallowed it.
        run: |
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" || true
          npx --yes @lhci/cli@0.15.1 autorun --collect.url="${{ steps.deploy.outputs.static_web_app_url }}"

      # continue-on-error above means a budget breach does not fail the deploy,
      # which is the intent -- but it equally hides a gate that could not run at
      # all. Those are different problems and must not look the same. This step
      # distinguishes them: reports present = it measured; absent = it did not,
      # and that gets an annotation on the PR rather than silence.
      - name: Report whether the budgets were actually measured
        if: always() && steps.deploy.outputs.static_web_app_url != ''
        run: |
          count=$(ls -1 .lighthouseci/lhr-*.json 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "::warning title=Lighthouse did not run::No Lighthouse reports were produced. The performance budgets were NOT measured for this PR -- this is not a pass. Check the Lighthouse step's log."
          else
            echo "Lighthouse produced $count report(s); outcome: ${{ steps.lighthouse.outcome }}"
            if [ "${{ steps.lighthouse.outcome }}" = "failure" ]; then
              echo "::warning title=Performance budget breached::Lighthouse ran and at least one budget assertion failed. Advisory for now; see the lighthouse-reports artifact."
            fi
          fi

      - name: Upload Lighthouse reports
        if: always() && steps.deploy.outputs.static_web_app_url != ''
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
          if-no-files-found: ignore

  # =============================================================================
  # CLEANUP JOB (for PRs)
  # =============================================================================
  # This job used to RACE the deploy it was cleaning up after, and lost.
  #
  # Observed on PR #75: cleanup ran 18:34:01-18:34:25 and reported success,
  # while the deploy from the preceding push ran until 18:35:02 and CREATED the
  # staging environment at 18:34:37 -- twelve seconds after its own cleanup had
  # finished. The environment was orphaned and the cleanup was green. Ten
  # accumulated that way, the Static Web App hit its staging-environment cap,
  # and preview deploys then failed on unrelated PRs with
  # "already has the maximum number of staging environments".
  #
  # The fix is ordering, not retrying: wait for every in-flight run of this
  # workflow on this PR's branch to finish, THEN close. Whatever a deploy
  # created, cleanup now removes afterwards rather than before.
  #
  # No new run can start behind us: `deploy-pr-to-azure` is gated on
  # `github.event.action != 'closed'`, and a closed PR cannot emit
  # `synchronize`.
  cleanup-pr:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    # Was 5. Now covers a full in-flight deploy (~5 min) plus the close itself.
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # list workflow runs to detect in-flight deploys

    steps:
      - name: Wait for in-flight deploys on this PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -uo pipefail

          # GITHUB_WORKFLOW_REF is
          #   owner/repo/.github/workflows/FILE.yml@refs/pull/N/merge
          #
          # Strip the @ref FIRST, then take the basename. The other order looks
          # equivalent and is not: `${VAR##*/}` on the full string returns
          # "merge", from the tail of refs/pull/N/merge. That 404s, and the
          # first version of this step shipped with exactly that bug.
          wf="${GITHUB_WORKFLOW_REF%%@*}"
          wf="${wf##*/}"
          api="repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?branch=$HEAD_REF&per_page=100"
          echo "workflow: $wf   branch: $HEAD_REF"

          # Returns a bare integer, or empty when the query could not answer.
          #
          # The empty case must be distinguishable from zero. `gh api` prints
          # its error BODY to stdout on a 404 while also exiting non-zero, so a
          # naive `|| echo 0` yields `{"message":"Not Found"...}0` -- which is
          # not a number, makes `[ "$n" -eq 0 ]` error rather than match, and
          # spins the loop for its full duration instead of failing. That is
          # what the first version did.
          query() {
            local out
            if out="$(gh api "$api" --jq "$1" 2>/dev/null)"; then
              case "$out" in
                ''|*[!0-9]*) printf '' ;;
                *)           printf '%s' "$out" ;;
              esac
            else
              printf ''
            fi
          }

          # Prove the query can see before trusting any zero it reports. A
          # filter that matches nothing answers "0 in flight", which is
          # indistinguishable from an idle branch and would silently restore
          # the race this step exists to prevent.
          total="$(query '.workflow_runs | length')"
          if [ -z "$total" ]; then
            echo "::error::Cannot list runs for workflow '$wf' on branch '$HEAD_REF'. Closing WITHOUT waiting -- an orphaned staging environment is possible. Check GITHUB_WORKFLOW_REF parsing and the actions:read permission."
            exit 0
          fi
          echo "runs visible for this branch (any status): $total"

          waited=0
          while [ "$waited" -lt 900 ]; do
            n="$(query "[.workflow_runs[]
                         | select(.id != $GITHUB_RUN_ID)
                         | select(.status == \"in_progress\" or .status == \"queued\")]
                        | length")"
            if [ -z "$n" ]; then
              echo "::error::Run query stopped answering mid-wait; closing without further waiting."
              exit 0
            fi
            if [ "$n" -eq 0 ]; then
              echo "No in-flight runs after ${waited}s; safe to close."
              exit 0
            fi
            echo "  ${n} run(s) still in flight (${waited}s elapsed) -- waiting"
            sleep 15
            waited=$((waited + 15))
          done
          echo "::warning::Still in flight after ${waited}s; closing anyway. If an environment is orphaned, this is why."

      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BRIDGINGTRUST_WEBSITE }}
          action: "close"
          app_location: "/"

  # =============================================================================
  # FAILURE NOTIFICATION (main branch only)
  # =============================================================================
  # A failed production deploy needs an owner. This job reuses one open issue
  # rather than filing a new one per run, so a repeatedly broken deploy is a
  # single conversation instead of a pile of duplicates. It now watches only the
  # single deployment job -- the Functions backend deploy was retired with the
  # API consolidation (2026-07-24).
  notify-failure:
    if: >-
      always()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.deploy-main-to-azure.result == 'failure'
    needs: [deploy-main-to-azure]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write

    steps:
      - name: Open or update the deploy-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          SITE_RESULT: ${{ needs.deploy-main-to-azure.result }}
        run: |
          set -uo pipefail

          # --repo is required on every gh call here: this job has no checkout
          # step, so there is no git remote for gh to infer the repository
          # from. Omitting it made `gh label create` fail silently, which then
          # made `gh issue create --label` fail with "'deploy-failure' not
          # found" and lost the notification entirely.
          gh label create deploy-failure --repo "$REPO" \
            --color B60205 \
            --description "A push to main failed to deploy" >/dev/null 2>&1 || true

          body="$(printf '%s\n' \
            "A production deploy from \`main\` failed." \
            "" \
            "| Job | Result |" \
            "|---|---|" \
            "| \`deploy-main-to-azure\` | \`${SITE_RESULT}\` |" \
            "" \
            "- Commit: \`${SHA}\`" \
            "- Run: ${RUN_URL}" \
            "" \
            "\`/api/*\` is served by the Next.js app itself (no linked backend), so a" \
            "failure here means the app or its deploy broke -- check this run's build" \
            "and deploy logs and the Static Web App application settings. Re-linking a" \
            "Function App is NOT the fix and must not be attempted (retired 2026-07-24;" \
            "unsupported for hybrid Next.js)." \
            "" \
            "Close this issue once the deploy is green again.")"

          existing="$(gh issue list --repo "$REPO" --state open \
            --label deploy-failure --limit 1 --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "Commented on existing issue #${existing}"
          else
            # Fall back to an unlabelled issue rather than losing the alert.
            gh issue create --repo "$REPO" \
              --title "Production deploy failing on main" \
              --label deploy-failure \
              --body "$body" \
            || gh issue create --repo "$REPO" \
              --title "Production deploy failing on main" \
              --body "$body"
          fi
