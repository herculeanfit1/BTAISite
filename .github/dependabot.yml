# Dependabot configuration.
#
# This file did not parse between 2025-05-25 and 2026-07-28, so NO Dependabot
# update ever ran on this repository -- 0 Dependabot PRs against 88 total.
# GitHub reported it on every commit that touched the file:
#
#   The property '#/updates/0/' contains additional properties
#   ["security-updates-only"] outside of the schema when none are allowed
#
# `security-updates-only` is not a Dependabot key. A config that fails to parse
# is ignored ENTIRELY -- not partially -- so the github-actions and docker
# entries below never ran either, despite being individually valid.
#
# Two things to know before editing:
#   - Validation is server-side, and the `.github/dependabot.yml` check only
#     runs on commits that CHANGE this file. A broken config therefore shows one
#     red check once and then looks clean forever. Watch that check on the PR
#     that edits this file; there is no local validator.
#   - Review assignment comes from .github/CODEOWNERS (`* @herculeanfit1`). The
#     `reviewers` key that used to be here is deprecated and has been removed.

version: 2
updates:
  # ---------------------------------------------------------------------------
  # npm
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    versioning-strategy: "lockfile-only"
    commit-message:
      prefix: "deps"
      include: "scope"

    # Grouping keeps a 14-month backlog from arriving as dozens of separate PRs
    # the first Saturday this actually runs. Patch and minor bumps are low-risk
    # and reviewed together; anything else still gets its own PR.
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-patches:
        dependency-type: "production"
        update-types:
          - "patch"

    # Majors stay held back. The roadmap's trigger for taking them on (a real
    # test gate exists) is now met -- Quality Gate runs type-check, the unit
    # suite and a build, and the e2e job runs Playwright including accessibility
    # -- but removing this line and working through the backlog it releases are
    # separate pieces of work. Do that deliberately, not as a side effect of
    # making the file parse.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Actions are pinned major-float (@vN) per STANDARDS § 15. A minor or patch
    # bump rewrites that to an exact @vN.N.N — the form the same rule forbids,
    # so Dependabot manufactures an S28 violation on a schedule, and CI passes
    # it, because standards-check.yml does not validate pin form.
    #
    # This costs nothing in security terms: @vN already resolves to the newest
    # N.x tag at run time, so patches arrive without a PR. Only majors need a
    # human, and a major bump keeps the major-float form.
    #
    # Scoped by namespace, NOT "*", and the distinction is load-bearing. Some
    # actions cannot be major-float pinned and depend on these PRs as their only
    # upgrade signal: aquasecurity/trivy-action is exact by design (§ 15
    # exemption), and hadolint/hadolint-action publishes no v3 tag at all —
    # only v3.0.0 … v3.4.0. A blanket "*" would silently freeze both.
    ignore:
      - dependency-name: "actions/*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "github/codeql-action*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"

  # ---------------------------------------------------------------------------
  # Docker
  # ---------------------------------------------------------------------------
  # Covers `dockerfile`, `Dockerfile.static` and `Dockerfile.test` -- on the
  # first real run Dependabot proposed all three together, correcting an earlier
  # note here that claimed only the root `dockerfile` was matched.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

    # The base image must track the Node version this repo pins, not drift past
    # it. `package.json` engines and `.nvmrc` both say 20.19.1, and CLAUDE.md
    # records that 23.x breaks the build. The first run after this config was
    # repaired proposed node 20.19-slim -> 26.5-slim (PR #96) -- four majors
    # past a version already known to break -- because the major `ignore` had
    # been applied to npm only.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
